<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carioca Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-icon">♠</div>
          <div>
            <p class="eyebrow">Juego de cartas</p>
            <h1>Carioca Online</h1>
          </div>
        </div>
        <div class="room-meta">
          <span id="room-badge">Sin sala</span>
        </div>
      </header>

      <main class="layout">
        <!-- PANEL LOBBY -->
        <section id="lobby-panel" class="panel lobby-panel">
          <h2>Crear o unirse a una sala</h2>

          <label>
            Tu nombre
            <input id="player-name" type="text" maxlength="18" value="Jugador" />
          </label>

          <label>
            Cantidad de jugadores
            <select id="player-count">
              <option value="2">2 jugadores</option>
              <option value="3">3 jugadores</option>
              <option value="4" selected>4 jugadores</option>
            </select>
          </label>

          <div class="button-row">
            <button id="create-room-btn" class="primary">Crear sala</button>
          </div>

          <div class="join-by-code">
            <input id="room-code" type="text" maxlength="5" placeholder="Código" style="width: 130px; margin-top: 0; text-transform: uppercase; text-align: center; letter-spacing: 0.15em;" />
            <button id="join-direct-btn">Entrar</button>
          </div>

          <div id="message-box" class="message-box"></div>

          <!-- INICIAR PARTIDA EN LOBBY -->
          <div id="start-game-section" class="start-game-section hidden">
            <label>
              Comenzar desde la etapa
              <select id="start-round">
                <option value="0" selected>1 - Dos tríos</option>
                <option value="1">2 - Un trío y una escala</option>
                <option value="2">3 - Dos escalas</option>
                <option value="3">4 - Tres tríos</option>
                <option value="4">5 - Dos tríos y una escala</option>
                <option value="5">6 - Dos escalas y un trío</option>
                <option value="6">7 - Escala faltante</option>
                <option value="7">8 - Escala real</option>
              </select>
            </label>
            <button id="start-game-btn" class="primary">Iniciar partida</button>
          </div>
        </section>

        <!-- PANEL JUEGO -->
        <section id="game-panel" class="panel game-panel hidden">
          <div class="table-topbar">
            <div>
              <p class="eyebrow">Ronda</p>
              <h3 id="round-label">Ronda 1</h3>
            </div>
            <div class="status-box">
              <span>Objetivo</span>
              <strong id="round-objective">-</strong>
            </div>
          </div>

          <div id="table-center" class="table-center">
            <div id="player-0" class="seat seat-top"></div>
            <div id="player-1" class="seat seat-left"></div>
            <div id="player-2" class="seat seat-right"></div>
            <div id="player-3" class="seat seat-bottom"></div>

            <div class="center-zone">
              <div class="deck-area">
                <button id="deck-button" class="deck-stack">
                  <div class="card-back"></div>
                  <span id="deck-count" class="card-count">0</span>
                </button>
                <button id="discard-button" class="discard-pile">
                  <div id="discard-preview" class="discard-card"></div>
                  <span id="discard-count" class="card-count">0</span>
                </button>
              </div>
            </div>

            <div class="table-status">
              <span id="table-message">Esperando jugadores...</span>
            </div>
          </div>

          <div class="player-hand-wrap">
            <div class="hand-header">
              <h4>Tu mano</h4>
              <div class="hand-actions">
                <button id="lay-down-btn" class="secondary">Bajarme</button>
              </div>
            </div>
            <div id="player-hand" class="player-hand"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- MODAL DE BAJARSE -->
    <div id="laydown-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Selecciona tus cartas</h3>
        
        <div class="laydown-container">
          <div class="laydown-section">
            <h4>Cartas disponibles</h4>
            <div id="laydown-hand" class="laydown-hand"></div>
          </div>

          <div class="laydown-buttons">
            <button id="add-trios-btn" class="secondary small">Agregar a Tríos</button>
            <button id="add-scales-btn" class="secondary small">Agregar a Escalas</button>
          </div>

          <div class="laydown-section">
            <h4>Tríos</h4>
            <div id="trios-selection" class="groups-list"></div>
          </div>

          <div class="laydown-section">
            <h4>Escalas</h4>
            <div id="scales-selection" class="groups-list"></div>
          </div>
        </div>

        <div id="laydown-status" class="laydown-status"></div>

        <div class="modal-actions">
          <button id="confirm-laydown-btn" class="primary">Confirmar</button>
          <button id="cancel-laydown-btn" class="secondary">Cancelar</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
